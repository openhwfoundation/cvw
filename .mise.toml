# Tools cvw installs with mise, for local use and CI.  bin/installation/mise-install.sh installs mise and
# then these tools, and setup.sh activates them.  Run `mise run prek` to check every file with the hooks in
# .pre-commit-config.yaml, as CI does.

[tools]
prek = "0.5.7"
uv = "0.12.23"

[tasks.prek]
description = "Run prek hooks on all files"
run = "prek run --all-files"
