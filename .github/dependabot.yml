# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Update git submodules to latest version
  # No cooldown: the submodules are tracked deliberately, riscv-arch-test in particular
  - package-ecosystem: "gitsubmodule" # zizmor: ignore[dependabot-cooldown]
    directory: "/"
    schedule:
      interval: "daily"
    ignore:
      - dependency-name: "addins/coremark"
      - dependency-name: "addins/embench-iot"
      - dependency-name: "addins/verilog-ethernet"
  # Update actions in the GitHub Actions workflow files
  - package-ecosystem: "github-actions"
    directories: # the workflows and the composite actions they use
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
