# SPDX-License-Identifier: Apache-2.0 WITH SHL-2.1
#
# Checks every pull request, merge-queue entry, and push to main:
# - the pre-commit hooks (prek), for the oldest and newest Python versions Wally supports
# - Verilator lint of the standard configurations (lint-wally)
# - the standard regression, one job per configuration (regression-wally --ci --config <cfg>):
#   the configuration's riscv-arch-test and peripheral tests on Verilator
# ci_pass is the single required status check.

name: Regression

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main

# Only run CI on the latest commit if a PR is updated
concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

env:
  WALLY: ${{ github.workspace }}
  # Trust cvw's and riscv-arch-test's .mise.toml
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}

jobs:
  prek:
    name: Pre-commit (Python ${{ matrix.version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: [39, 313] # Oldest and newest versions used in wally-package-install.sh
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set Python version
        env:
          VERSION: ${{ matrix.version }}
        run: sed -i "/^target-version/c\\target-version = \"py${VERSION}\"" .ruff.toml

      - name: Set up mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5
        with:
          cache_save: ${{ github.ref == 'refs/heads/main' }}

      - name: Restore prek hook environments
        id: prek-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/prek
          key: prek-${{ runner.os }}-${{ hashFiles('.mise.toml', '.pre-commit-config.yaml') }}

      - name: Run prek
        run: prek run --all-files --show-diff-on-failure --color=always

      - name: Save prek hook environments
        if: github.ref == 'refs/heads/main' && steps.prek-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/prek
          key: prek-${{ runner.os }}-${{ hashFiles('.mise.toml', '.pre-commit-config.yaml') }}

  lint:
    name: Lint (Verilator)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up tools
        # The $/ self-repository form downloads cvw as an action archive, which fails on the dangling
        # bin/sim_bp symlink, so use the checkout
        uses: ./.github/actions/setup-tools # zizmor: ignore[self-repository]
        with:
          verilator: "true"

      # lint-wally also lints a derivative configuration
      - name: Lint
        run: |
          make deriv
          lint-wally

  regression:
    name: Regression (${{ matrix.config }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        config: [rv32i, rv64i, rv32imc, rv32imcb, rv32gc, rv64gc] # standard_configs in regression-wally
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check out riscv-arch-test
        run: git submodule update --init --depth 1 addins/riscv-arch-test

      - name: Set up tools
        # The $/ self-repository form downloads cvw as an action archive, which fails on the dangling
        # bin/sim_bp symlink, so use the checkout
        uses: ./.github/actions/setup-tools # zizmor: ignore[self-repository]
        with:
          verilator: "true"
          act: "true"

      - name: Regression
        env:
          CONFIG: ${{ matrix.config }}
        run: regression-wally --ci --config "$CONFIG"

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: regression-logs-${{ matrix.config }}
          path: sim/verilator/logs

  # The one check that branch protection and the merge queue require, so that they need not list
  # every matrix job
  ci_pass:
    name: CI pass
    runs-on: ubuntu-latest
    needs: [prek, lint, regression]
    if: always()
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            [[ "$result" == "success" ]] || exit 1
          done
