# SPDX-License-Identifier: Apache-2.0 WITH SHL-2.1
#
# Weekly run of the nightly regression's Verilator part (regression-wally --ci --nightly): lint of
# every derivative configuration, the standard tests with the short buildroot boot, the derivative
# configurations, the cache simulations, and Embench and CoreMark.  A second job boots buildroot Linux
# fully on Verilator (regression-wally --ci --config rv64gc --buildroot).  The lockstep and testfloat
# parts need commercial tools (Questa, ImperasDV), so they stay in the local nightly.  It runs only in
# openhwfoundation/cvw, not in forks.
#
# A failed scheduled run opens an issue labeled nightly-failure (create the label once in the repository),
# or comments on the open one, with what failed, the commit and tool versions, and the commands that
# reproduce it locally (.github/scripts/nightly-report.sh); the next passing run closes it.

name: Nightly regression

on:
  schedule:
    - cron: "0 8 * * 6" # Saturdays at 12:00 AM Pacific Time
  workflow_dispatch:

permissions:
  contents: read

env:
  WALLY: ${{ github.workspace }}
  # The buildroot tests load the Linux testvectors from $RISCV
  RISCV: /opt/riscv
  # Trust cvw's and riscv-arch-test's .mise.toml
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}

jobs:
  # The multilib GCC (Embench and CoreMark link C libraries for rv32) and the buildroot testvectors
  tools:
    name: Tools
    if: github.repository == 'openhwfoundation/cvw'
    uses: ./.github/workflows/tools.yml # zizmor: ignore[self-repository]

  nightly:
    name: Nightly regression (Verilator)
    needs: tools
    runs-on: ubuntu-latest
    timeout-minutes: 345
    outputs:
      report: ${{ steps.report.outputs.report }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check out submodules
        run: git submodule update --init --depth 1 addins/riscv-arch-test addins/embench-iot addins/coremark

      - name: Set up tools
        # The $/ self-repository form downloads cvw as an action archive, which fails on the dangling
        # bin/sim_bp symlink, so use the checkout
        uses: ./.github/actions/setup-tools # zizmor: ignore[self-repository]
        with:
          verilator: "true"
          act: "true"
          buildroot: "true"

      - name: Nightly regression
        run: |
          set -o pipefail
          regression-wally --ci --nightly 2>&1 | tee regression.log

      # What failed, the versions, and the commands that reproduce it, for the job summary and the
      # report job
      - name: Write failure report
        id: report
        if: failure()
        run: |
          .github/scripts/nightly-report.sh regression.log report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          delimiter="EOF_$(openssl rand -hex 8)"
          { echo "report<<$delimiter"; cat report.md; echo "$delimiter"; } >> "$GITHUB_OUTPUT"

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nightly-logs
          path: |
            regression.log
            sim/verilator/logs
            benchmarks/embench/run.log

  # The full Linux boot takes hours, so it runs beside the rest of the nightly, with rv64gc's standard tests
  buildroot:
    name: Buildroot Linux boot (Verilator)
    needs: tools
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check out riscv-arch-test
        run: git submodule update --init --depth 1 addins/riscv-arch-test

      - name: Set up tools
        # The $/ self-repository form downloads cvw as an action archive, which fails on the dangling
        # bin/sim_bp symlink, so use the checkout
        uses: ./.github/actions/setup-tools # zizmor: ignore[self-repository]
        with:
          verilator: "true"
          act: "true"
          buildroot: "true"

      - name: Buildroot boot
        run: regression-wally --ci --config rv64gc --buildroot

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: buildroot-logs
          path: sim/verilator/logs

  report:
    name: Report
    needs: [tools, nightly, buildroot]
    if: always() && github.event_name == 'schedule' && github.repository == 'openhwfoundation/cvw'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open, update, or close the nightly-failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
          REPORT: ${{ needs.nightly.outputs.report }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          label=nightly-failure
          issue=$(gh issue list --repo "$REPO" --label "$label" --state open --json number --jq '.[0].number')
          if [[ "$RESULTS" == "success success success" ]]; then
            if [[ -n "$issue" ]]; then
              gh issue close "$issue" --repo "$REPO" --comment "The nightly regression passed again: $RUN_URL"
            fi
            exit 0
          fi
          # Without a report, the regression did not run or passed: a tool build or the buildroot boot failed
          body="$(printf 'The weekly nightly regression failed (job results: tools, nightly, buildroot = %s): %s\n\n%s\n' \
            "$RESULTS" "$RUN_URL" "${REPORT:-See the run for the failed job; its installer script (bin/installation/) or \`regression-wally --ci --config rv64gc --buildroot\` reproduces it at commit $SHA.}")"
          if [[ -n "$issue" ]]; then
            gh issue comment "$issue" --repo "$REPO" --body "$body"
          else
            gh issue create --repo "$REPO" --title "Weekly nightly regression failed" --label "$label" --body "$body"
          fi
