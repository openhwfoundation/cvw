# yaml-language-server: $schema=https://raw.githubusercontent.com/riscv/riscv-unified-db/main/spec/schemas/config_schema.json
# SPDX-License-Identifier: Apache-2.0
# UDB configuration for CORE-V Wally rv64i: base integer ISA only, no Zicsr and no M-mode CSRs.
# Sm is declared only because UDB cannot express MXLEN without it; include_priv_tests is False
# and rvmodel_macros.h leaves STANDARD_SM_SUPPORTED undefined, so no boot or trap code touches CSRs.
---
$schema: config_schema.json#
kind: architecture configuration
type: fully configured
name: cvw-rv64i
description: CORE-V Wally rv64i - base ISA only, no CSRs
implemented_extensions:
  - { name: I, version: "= 2.1" }
  - { name: Sm, version: "= 1.11.0" }
params:
  # XLEN / address width
  MXLEN: 64
  # 32-bit AXI address bus: "output [31:0] mem_axi_awaddr".
  # https://github.com/YosysHQ/picorv32/blob/ef203c2b0a3fb793280f5114941416c425c5b461/picorv32.v#L2555-L2585
  PHYS_ADDR_WIDTH: 56
  M_MODE_ENDIANNESS: little

  # misa: NO SUCH CSR, so no bit of it is mutable either.
  MISA_CSR_IMPLEMENTED: false

  # PRECISE_SYNCHRONOUS_EXCEPTIONS: false. PicoRV32 does not deliver synchronous
  # exceptions at all. Every condition the spec calls an exception instead drives
  # the `trap` output and parks the core in cpu_state_trap forever; nothing is
  # recorded and nothing resumes. "cpu_state_trap: begin trap <= 1; end"
  # https://github.com/YosysHQ/picorv32/blob/ef203c2b0a3fb793280f5114941416c425c5b461/picorv32.v#L1485-L1489
  PRECISE_SYNCHRONOUS_EXCEPTIONS: false

  # ecall/ebreak reach cpu_state_trap when ENABLE_IRQ=0, so "traps" in the sense of
  # "does not simply retire" is true. There is no handler to enter.
  # https://github.com/YosysHQ/picorv32/blob/ef203c2b0a3fb793280f5114941416c425c5b461/picorv32.v#L1605-L1611
  TRAP_ON_ECALL_FROM_M: true
  TRAP_ON_EBREAK: true
  # CATCH_ILLINSN=1: any encoding outside the decode table sets instr_trap.
  # https://github.com/YosysHQ/picorv32/blob/ef203c2b0a3fb793280f5114941416c425c5b461/picorv32.v#L679-L690
  TRAP_ON_UNIMPLEMENTED_INSTRUCTION: true
  TRAP_ON_RESERVED_INSTRUCTION: true
  # Every CSR is unimplemented, so every csrr* encoding is simply an unknown
  # encoding and halts through the same CATCH_ILLINSN path.
  TRAP_ON_UNIMPLEMENTED_CSR: true
  TRAP_ON_ILLEGAL_WLRL: false # NO SUCH CSR: no WLRL field exists to write.

  # mtval: NO SUCH CSR. Nothing is reported anywhere, ever.
  REPORT_VA_IN_MTVAL_ON_BREAKPOINT: false
  REPORT_VA_IN_MTVAL_ON_LOAD_MISALIGNED: false
  REPORT_VA_IN_MTVAL_ON_STORE_AMO_MISALIGNED: false
  REPORT_VA_IN_MTVAL_ON_INSTRUCTION_MISALIGNED: false
  REPORT_VA_IN_MTVAL_ON_LOAD_ACCESS_FAULT: false
  REPORT_VA_IN_MTVAL_ON_STORE_AMO_ACCESS_FAULT: false
  REPORT_VA_IN_MTVAL_ON_INSTRUCTION_ACCESS_FAULT: false
  REPORT_ENCODING_IN_MTVAL_ON_ILLEGAL_INSTRUCTION: false
  MTVAL_WIDTH: 64 # NO SUCH CSR; UDB requires a width and MXLEN is the only sane one.

  # Misaligned accesses. Built with CATCH_MISALIGN=1, so a misaligned load, store
  # or fetch halts the core rather than being emulated or split. README.md,
  # "Parameters": "CATCH_MISALIGN (default = 1) ... Set this to 0 to disable the
  # circuitry for catching misaligned memory accesses."
  # https://github.com/YosysHQ/picorv32/blob/ef203c2b0a3fb793280f5114941416c425c5b461/picorv32.v#L1922-L1944
  MISALIGNED_LDST: false
  # The alignment check is made on reg_op1 before the bus access is issued, so no
  # access fault can precede it: the misaligned condition wins.
  MISALIGNED_LDST_EXCEPTION_PRIORITY: high

  # Machine information registers: NO SUCH CSRs. mvendorid/marchid/mimpid do not
  # exist; an unimplemented read-only CSR is architecturally zero.
  MARCHID_IMPLEMENTED: false
  MIMPID_IMPLEMENTED: false
  VENDOR_ID_BANK: 0x0
  VENDOR_ID_OFFSET: 0x0

  # No PMA hardware. The AXI data bus is 32 bits wide with a 4-bit write strobe
  # ("output [3:0] mem_axi_wstrb"), so the natural granule is 4 bytes = 2^2.
  PMA_GRANULARITY: 2

  # mtvec: NO SUCH CSR. Modelled as read-only zero in direct mode, which is what a
  # hardwired-zero mtvec would look like.
  MTVEC_ACCESS: ro
  MTVEC_MODES: [0]
  MTVEC_ILLEGAL_WRITE_BEHAVIOR: custom

  # Counters. mcountinhibit does not exist. rdcycle/rdinstret exist only as fixed
  # instruction encodings with no CSR behind them, and no hpmcounter exists at all.
  MCOUNTINHIBIT_IMPLEMENTED: false
  HPM_COUNTER_EN:
    [
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
    ]
  # mcounteren does not exist and there is no U-mode to enable counters for.
  MCOUNTENABLE_EN:
    [
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
      false,
    ]

  # No PMP hardware of any kind.
  NUM_PMP_ENTRIES: 0
